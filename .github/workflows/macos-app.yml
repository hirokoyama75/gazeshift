name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [codex/gazeshift-v2]
    paths: ['**.py', 'packaging/**', 'pyproject.toml', 'uv.lock', '.github/workflows/macos-app.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      UV_PROJECT_ENVIRONMENT: .cache/mac-build-env
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Build and check the standalone app
        run: uv run --locked --exact --group build --extra virtualcam python scripts/build_macos.py
      - name: Compare CPU thread choices
        run: uv run --locked --exact --group build --extra virtualcam python scripts/benchmark_threads.py --report artifacts/macos/cpu-threads.json
      - name: Save app, source and measured backend reports
        uses: actions/upload-artifact@v4
        with:
          name: Gazeshift-macOS-arm64
          path: |
            artifacts/macos/*.zip
            artifacts/macos/*.json
          if-no-files-found: error
      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build-diagnostics
          path: |
            .cache/macos-build/work/**/warn-*.txt
            artifacts/macos/*.json
