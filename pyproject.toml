[project]
name = "gazeshift"
version = "2.0.0"
description = "Geometric eye redirection with original FLX checkpoints"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==1.26.4", "opencv-python==4.11.0.86", "mediapipe==0.10.32"]

[project.optional-dependencies]
virtualcam = ["pyvirtualcam==0.14.0"]
dml = ["onnxruntime-directml>=1.23,<2; sys_platform == 'win32'"]
cuda = ["onnxruntime-gpu>=1.23,<2; sys_platform == 'win32'"]

[dependency-groups]
cpu = ["onnxruntime==1.24.3"]
dev = ["pytest==8.3.5", "pytest-timeout==2.3.1", "onnx==1.17.0"]

[tool.uv]
package = false
# Tasks uses only core cv2. Substitute the pinned core wheel for MediaPipe's
# overbroad contrib requirement, avoiding two wheels owning the same namespace.
override-dependencies = ["opencv-contrib-python; sys_platform == 'emscripten'"]
default-groups = ["cpu"]
conflicts = [[{group = "cpu"}, {extra = "dml"}, {extra = "cuda"}]]

[tool.pytest.ini_options]
testpaths = ["tests/headless"]
timeout = 30
addopts = "-ra --strict-markers"


